[pytest]
markers =
    basic: starter runs + Hydra config filled + decorator + CLI overrides (level 1)
    advanced: run tracking logs params, metrics, artifact (level 2)
    expert: 4 experiments + reproducibility + comparison (level 3)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
