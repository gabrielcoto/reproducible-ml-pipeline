# Pinned direct dependencies — minimal lock.
#
# The reference metric values (method-note.md §6) were calibrated against
# exactly these versions. Install with:
#
#     pip install -r requirements.lock
#
# Why a minimal lock and not a full `pip freeze`?
#   A full freeze captures dependencies that vary across
#   machines and pull in packages unrelated to this seminar. Installing GDAL on Windows
#   requires system C libraries which requires further installs — that turns
#   `pip install -r requirements.lock` from a one-line command into a
#   debugging session.
#
#   This minimal lock pins only the four direct dependencies plus pytest.
#   pip will resolve transitive deps (numpy, scipy, sqlalchemy, etc.)
#   automatically at install time. The reference values depend only on
#   scikit-learn's version, so pinning it is sufficient for reproducibility.
#
# To regenerate (if you ever need the full transitive pin set on a
# clean venv):
#   python -m venv .venv && source .venv/bin/activate
#   pip install -r requirements.lock   # this file
#   pip freeze > requirements.full.lock
scikit-learn==1.5.2
mlflow==3.17.1
hydra-core==1.3.7
pytest==8.3.5
